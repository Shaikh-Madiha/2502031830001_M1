<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>

var person = new Object();

// Assign fields to object "person"
person.firstName = "Naaz";
person.lastName = "Shaikh";

// Assign a method to object "person"
person.sayHi = () => {
    alert("Welcome " + person.firstName + " " + person.lastName);
}

person.sayHi();

</script>

<script>

var person = {
    firstName: "Naaz",
    lastName: "Shaikh",

    sayHi : function() {
        alert("Hi! " + person.firstName + " " + person.lastName);
    }
}

person.sayHi();

</script>

</body>
</html>
