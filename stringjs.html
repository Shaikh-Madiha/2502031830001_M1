<!DOCTYPE html>
<html>
<head>
    <title>String Methods</title>
</head>
<body>

<script>

var str = " Hello JavaScript ";

document.write("Original String = " + str + "<br><br>");

document.write("charAt(1) = " + str.charAt(1) + "<br>");

document.write("concat() = " + str.concat(" Tutorial") + "<br>");

document.write("indexOf('J') = " + str.indexOf('J') + "<br>");

document.write("lastIndexOf('a') = " + str.lastIndexOf('a') + "<br>");

document.write("search('Java') = " + str.search('Java') + "<br>");

document.write("match('Java') = " + str.match('Java') + "<br>");

document.write("replace() = " + str.replace('JavaScript','JS') + "<br>");

document.write("substr(1,5) = " + str.substr(1,5) + "<br>");

document.write("substring(1,6) = " + str.substring(1,6) + "<br>");

document.write("slice(1,6) = " + str.slice(1,6) + "<br>");

document.write("toLowerCase() = " + str.toLowerCase() + "<br>");

document.write("toLocaleLowerCase() = " + str.toLocaleLowerCase() + "<br>");

document.write("toUpperCase() = " + str.toUpperCase() + "<br>");

document.write("toLocaleUpperCase() = " + str.toLocaleUpperCase() + "<br>");

document.write("toString() = " + str.toString() + "<br>");

document.write("valueOf() = " + str.valueOf() + "<br>");

document.write("split() = " + str.split(" ") + "<br>");

document.write("trim() = " + str.trim() + "<br>");

</script>

</body>
</html>
