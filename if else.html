<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Check the number is odd or even</h1>
    <script>
        var a=4;
        document.write("a="+a+"<br>");
        if(a%2==0){
            document.write(+a+" is even");
        }
        else{
            document.write( +a+" is odd")
        }
    </script>
    <h1>Check pass or fail</h1>
    <script>
        var marks=99;
        document.write("marks="+marks+"<br>");
        if(marks>33){
            document.write("you are pass");
        }
        else{
            document.write("you are fail");
        }
    </script>
    <h1>Check leap year or not</h1>
    <script>
        var year=2024;
        document.write("year="+year+"<br>");
         if ((year % 4 == 0 && year % 100 != 0) || (year % 400 == 0)){
            document.write(" year is leap year");
        }
        else{
            document.write( " year is not leap year")
        }
    </script>
    
    <h1>Check driving Eligiblity</h1>
    <script>
        var age_driver=10;
        document.write("age_driver="+age_driver+"<br>");
         if (age_driver >18 ){
            document.write("you can drive");
        }
        else{
            document.write( "you can not drive")
        }
    </script>
    
</body>
</html>
