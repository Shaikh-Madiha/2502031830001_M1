<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>

    <style>

        h1{
            position: relative;
            left: 50px;
            top: 20px;
            border: 2px solid black;
            padding: 10px;
            
        }

        h2{
            position: absolute;
            left: 50px;
            top: 150px;
            border: 5px solid red;
            padding: 5px
        }

        h3{
            position: fixed;
            left: 50px;
            top: 300px;
            border: 2px solid blue;
            padding: 20px;
        }
  .division{
    background-color: red;
    float: left;
    width: 40%;


  }
  .division2{
    background-color: red;
    float: right;
    width: 40%;
  }
    </style>
</head>

<body>

    <h1>This is example of css position - relative</h1>

    <h2>This is example of css position - absolute</h2>

    <h3>This is example of css position - fixed</h3>
    
    
<div class="division">
    ABC content
</div>
<div class="division2">XYZ content</div>
</body>
</html>
